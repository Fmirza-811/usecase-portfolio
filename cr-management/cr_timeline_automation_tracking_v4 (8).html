<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>CR Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
:root{--navy:#0f2044;--blue:#1e5fc2;--blue-light:#3d7de8;--slate:#4a5568;--slate-light:#718096;--border:#e2e8f0;--card:#fff;--green:#0d9e6e;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;--teal:#0891b2;--green-bg:#d1fae5;--amber-bg:#fef3c7;--red-bg:#fee2e2;--purple-bg:#ede9fe;--teal-bg:#cffafe;--green-text:#065f46;--amber-text:#92400e;--red-text:#991b1b;--purple-text:#5b21b6;--teal-text:#164e63;--sidebar-w:218px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.sidebar-brand{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-icon{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:9px;color:#fff}
.sidebar-brand h1{font-size:11px;font-weight:700;color:#fff;letter-spacing:.6px;text-transform:uppercase;line-height:1.4}
.sidebar-brand p{font-size:9px;color:rgba(255,255,255,.38);margin-top:1px}
.sidebar-nav{padding:8px 0;flex:1}
.nav-section{padding:4px 16px;font-size:9px;font-weight:600;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.9px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.6);transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--blue-light)}
.nav-icon{width:14px;height:14px;flex-shrink:0;opacity:.75}
.nav-item.active .nav-icon{opacity:1}
.sidebar-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-user .u-name{font-size:12px;font-weight:600;color:#fff}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h2{font-size:15px;font-weight:700;color:var(--navy)}
.topbar-right{display:flex;align-items:center;gap:9px}
.content{padding:18px 22px;flex:1}
.card{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:16px}
.card-title{font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:13px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
.card-title svg{width:14px;height:14px;flex-shrink:0}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:14px 16px}
.stat-label{font-size:10px;font-weight:600;color:var(--slate-light);text-transform:uppercase;letter-spacing:.6px}
.stat-value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;line-height:1}
.stat-sub{font-size:10.5px;color:var(--slate-light);margin-top:3px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-amber{background:var(--amber-bg);color:var(--amber-text)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:var(--purple-bg);color:var(--purple-text)}
.badge-teal{background:var(--teal-bg);color:var(--teal-text)}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-navy{background:#e0e7ff;color:#1e1b4b}
.badge-slate{background:#e2e8f0;color:#334155}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:#f8fafc;padding:7px 9px;text-align:left;font-size:10px;font-weight:700;color:var(--slate);border-bottom:2px solid var(--border);white-space:nowrap;letter-spacing:.3px;text-transform:uppercase}
td{padding:8px 9px;border-bottom:1px solid var(--border);color:#2d3748;vertical-align:middle}
tr:hover td{background:#fafbff}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;line-height:1}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover:not(:disabled){background:var(--navy)}
.btn-secondary{background:#fff;color:var(--slate);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:#f8fafc}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#057a55}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover:not(:disabled){background:#0e7490}
.btn-sm{padding:4px 9px;font-size:10.5px}
.btn-sm svg{width:11px;height:11px}
.form-group{margin-bottom:13px}
label{display:block;font-size:11px;font-weight:600;color:var(--slate);margin-bottom:4px;letter-spacing:.2px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;color:#1a1a2e;background:#fff;outline:none;transition:border .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue-light);box-shadow:0 0 0 2px rgba(61,125,232,.12)}
textarea{resize:vertical}
input[disabled],select[disabled],textarea[disabled]{background:#f8fafc;color:#64748b;cursor:not-allowed;border-color:#e2e8f0}
.field-locked{position:relative}
.lock-icon{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--slate-light);pointer-events:none}
.lock-icon svg{width:12px;height:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.section-gap{margin-bottom:14px}
.pm-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px}
.pm-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.progress-bar{height:4px;border-radius:2px;background:#e2e8f0;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:2px;transition:width .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:10px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.22)}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:1}
.modal-body{padding:18px}
.urgent-banner{background:#fff5f5;border:1px solid #fca5a5;border-left:4px solid var(--red);border-radius:7px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:13px}
.urgent-banner svg{width:16px;height:16px;flex-shrink:0;color:var(--red)}
.info-banner{background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid var(--teal);border-radius:7px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:13px;font-size:11.5px;color:var(--teal-text)}
.info-banner svg{width:15px;height:15px;flex-shrink:0;color:var(--teal)}
.success-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid var(--green);border-radius:7px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:13px;font-size:11.5px;color:var(--green-text)}
.success-banner svg{width:15px;height:15px;flex-shrink:0}
.search-bar{position:relative;flex:1;max-width:260px}
.search-bar input{padding-left:30px;font-size:12px}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--slate-light)}
.filter-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar select{width:auto;font-size:11.5px;padding:5px 7px}
.stage-badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:600;background:#e0e7ff;color:#3730a3;white-space:nowrap}
.stage-badge.pending{background:#fef9c3;color:#854d0e}
.stage-badge.closed{background:#dcfce7;color:#14532d}
.brd-row{display:flex;align-items:center;gap:11px;padding:10px;background:#f8fafc;border-radius:7px;border:1px solid var(--border);margin-bottom:7px}
.brd-row svg{width:18px;height:18px;flex-shrink:0;color:var(--blue);opacity:.7}
.brd-info{flex:1}
.brd-name{font-size:12px;font-weight:600;color:var(--navy)}
.brd-meta{font-size:10.5px;color:var(--slate-light);margin-top:2px}
.logic-box{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid var(--amber);border-radius:7px;padding:12px;font-size:11.5px;line-height:1.8;color:#78350f}
.admin-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.admin-row:last-child{border-bottom:none}
.admin-row label{min-width:190px;margin-bottom:0}
.admin-row input{width:75px}
.scroll-table{overflow-x:auto}
.cr-title-link{color:var(--blue);cursor:pointer;font-weight:600}
.cr-title-link:hover{text-decoration:underline}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:7px;padding:10px 12px;font-size:11.5px;color:#1e40af;margin-bottom:13px;line-height:1.5}
.close-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--slate-light);flex-shrink:0}
.close-btn svg{width:13px;height:13px}
.close-btn:hover{background:#f8fafc}
.client-source-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.signoff-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:7px;border:1px solid var(--border);background:#f8fafc;margin-bottom:8px}
.signoff-label{font-size:12px;font-weight:600;color:var(--navy)}
.signoff-sub{font-size:10.5px;color:var(--slate-light);margin-top:2px}
.signoff-done{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--green)}
.drafting-layout{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
.prompt-box{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:14px}
.prompt-box-title{font-size:10.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.prompt-box-title svg{width:13px;height:13px;flex-shrink:0}
.prompt-textarea{width:100%;min-height:100px;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;font-family:inherit;line-height:1.6;background:#fff;resize:vertical;color:#1a1a2e;outline:none;transition:border .15s}
.prompt-textarea:focus{border-color:var(--blue-light);box-shadow:0 0 0 2px rgba(61,125,232,.12)}
.prompt-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.prompt-chip{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:500;background:#e0e7ff;color:#3730a3;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.prompt-chip:hover{background:#c7d2fe}
.char-count{font-size:10px;color:var(--slate-light);text-align:right;margin-top:3px}
.draft-output{background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.draft-output-header{padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.draft-output-header-left{font-size:11.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:5px}
.draft-output-header-left svg{width:13px;height:13px;flex-shrink:0}
.draft-output-actions{display:flex;gap:5px}
.draft-textarea{width:100%;min-height:340px;padding:14px;border:none;font-size:12px;font-family:'Courier New',monospace;line-height:1.7;background:#fff;resize:vertical;color:#1a1a2e;outline:none;display:block}
.generating-overlay{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fafcff;color:var(--slate-light);font-size:12.5px}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ver-panel{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px}
.ver-panel-title{font-size:10.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px;display:flex;align-items:center;gap:5px}
.ver-panel-title svg{width:13px;height:13px;flex-shrink:0}
.ver-count{background:var(--blue);color:#fff;border-radius:20px;padding:1px 6px;font-size:9.5px;font-weight:700;margin-left:auto}
.ver-item{padding:9px 10px;border-radius:7px;border:1px solid var(--border);margin-bottom:7px;cursor:pointer;transition:all .15s;background:#fff}
.ver-item:hover{border-color:var(--blue-light);background:#f0f7ff}
.ver-item.active-ver{border-color:var(--blue);background:#eff6ff}
.ver-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.ver-num{font-size:10.5px;font-weight:700;color:var(--blue)}
.ver-time{font-size:9.5px;color:var(--slate-light)}
.ver-meta{font-size:10.5px;color:var(--slate);margin-bottom:3px}
.ver-prompt{font-size:10.5px;color:var(--slate-light);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver-actions{display:flex;gap:4px;margin-top:7px}
.empty-state{text-align:center;padding:28px 14px;color:var(--slate-light);font-size:11.5px;line-height:1.6}
.diff-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:600;background:#f0f7ff;color:var(--blue);border:1px solid #bfdbfe}
.diff-badge svg{width:10px;height:10px;flex-shrink:0}
.cr-context{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:7px 11px;background:#f8fafc;border:1px solid var(--border);border-radius:7px;font-size:11.5px}
.setup-card{background:var(--card);border-radius:9px;border:1px solid var(--border);padding:16px;margin-bottom:14px}
.error-box{margin-top:9px;padding:7px 11px;background:#fff5f5;border:1px solid #fca5a5;border-radius:5px;font-size:11.5px;color:var(--red-text)}
.chart-wrap{width:100%;overflow:hidden}
.grid-line{stroke:#e2e8f0;stroke-width:.5;stroke-dasharray:3 3}
.axis-line{stroke:#cbd5e0;stroke-width:1}
/* CR detail */
.cr-detail-page{max-width:900px}
.field-section{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:14px}
.field-section-title{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.locked-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--slate-light);background:#f1f5f9;border:1px solid var(--border);border-radius:4px;padding:2px 7px}
.locked-badge svg{width:11px;height:11px}
.workflow-stepper{display:flex;align-items:center;gap:0;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.step-node{padding:5px 11px;border-radius:20px;font-size:9.5px;font-weight:700;white-space:nowrap;border:1.5px solid var(--border);background:#fff;color:var(--slate-light);flex-shrink:0}
.step-node.done{background:var(--green-bg);border-color:var(--green);color:var(--green-text)}
.step-node.active{background:#dbeafe;border-color:var(--blue);color:#1e40af}
.step-arrow{width:18px;height:1.5px;background:var(--border);flex-shrink:0}
/* Estimation panel */
.est-panel{background:linear-gradient(135deg,#f0f7ff 0%,#fafbff 100%);border:1.5px solid #bfdbfe;border-radius:10px;padding:18px;margin-bottom:14px}
.est-panel-title{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.est-panel-title svg{width:14px;height:14px;flex-shrink:0}
.est-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.est-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.est-box-label{font-size:9.5px;font-weight:700;color:var(--slate-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.est-box-value{font-size:22px;font-weight:700;color:var(--navy);line-height:1}
.est-box-unit{font-size:11px;color:var(--slate-light);margin-top:2px}
.est-box.highlight{border-color:var(--blue-light);background:#eff6ff}
.est-box.highlight .est-box-value{color:var(--blue)}
.score-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin-bottom:14px}
.score-fill{height:100%;border-radius:4px;transition:width .5s;background:var(--blue)}
.breakdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.breakdown-item{background:#fff;border:1px solid var(--border);border-radius:7px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.breakdown-item-label{font-size:9.5px;font-weight:600;color:var(--slate-light);text-transform:uppercase;letter-spacing:.4px}
.breakdown-item-value{font-size:12.5px;font-weight:700;color:var(--navy)}
.breakdown-item-score{font-size:10.5px;color:var(--slate-light)}
.est-not-ready{background:#f8fafc;border:1.5px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--slate-light);font-size:12.5px;margin-bottom:14px}
.est-not-ready svg{width:28px;height:28px;margin-bottom:8px;opacity:.35;display:block;margin-left:auto;margin-right:auto}
.urgent-est-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:var(--red-bg);color:var(--red-text);font-size:10.5px;font-weight:700;border:1px solid #fca5a5;margin-left:8px}
.role-restricted{background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:10px 14px;font-size:11.5px;color:#9a3412;display:flex;align-items:center;gap:8px}
.role-restricted svg{width:15px;height:15px;flex-shrink:0}
</style>
</head>

/* ENGINE */
function calcScore(c,b,u,hs){const cm={Low:1,Medium:2,High:3},hm={S:1,M:2,L:3,XL:4};return(cm[c]||0)+(cm[b]||0)+(cm[u]||0)+(hm[hs]||0);}
function getBand(s,cfg){if(s>=cfg.score_low_min&&s<=cfg.score_low_max)return'Low';if(s>=cfg.score_med_min&&s<=cfg.score_med_max)return'Medium';return'High';}
function getEst(band,cfg){if(band==='Low')return{brdDays:cfg.low_brd,rsDays:cfg.low_rs,fsDays:cfg.low_fs,hleDays:cfg.low_hle};if(band==='High')return{brdDays:cfg.high_brd,rsDays:cfg.high_rs,fsDays:cfg.high_fs,hleDays:cfg.high_hle};return{brdDays:cfg.med_brd,rsDays:cfg.med_rs,fsDays:cfg.med_fs,hleDays:cfg.med_hle};}
function logicTxt(c,b,u,hs,score,band,est){const cm={Low:1,Medium:2,High:3},hm={S:1,M:2,L:3,XL:4};return`Score breakdown: Complexity (${c}) = ${cm[c]}, Business Impact (${b}) = ${cm[b]}, Urgency (${u}) = ${cm[u]}, HLE Size (${hs}) = ${hm[hs]}. Total score = ${score}, which maps to the ${band} estimation band (${band==='Low'?'4–5':band==='Medium'?'6–8':'9–13'}). Applied timeline estimates: BRD Finalisation ${est.brdDays}d · RS Drafting ${est.rsDays}d · FS Drafting ${est.fsDays}d · HLE Turnaround ${est.hleDays}d.`;}

  const urgent=urgency==='High';
  const cm={Low:1,Medium:2,High:3},hm={S:1,M:2,L:3,XL:4};
